name: Ses Merkezi Android otomatik test APK
# v9: scan the private Android source checkout as the workspace root with CodeQL

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android-test-apk.yml"

permissions:
  actions: read
  contents: write
  security-events: write

concurrency:
  group: ses-merkezi-android-test-apk-v9
  cancel-in-progress: false

jobs:
  detect:
    name: Özel kaynak deposundaki Android değişikliklerini izle
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      source_sha: ${{ steps.detect.outputs.source_sha }}
      version: ${{ steps.detect.outputs.version }}
      version_code: ${{ steps.detect.outputs.version_code }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Özel Ses Merkezi kaynak kodunu al
        uses: actions/checkout@v4
        with:
          repository: ibrahimFOH/Stagepulse-Ses-Merkezi
          ref: main
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Son Android kaynak sürümünü denetle
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD:android)"
          VERSION_DATA="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("android/app/build.gradle").read_text(encoding="utf-8")
          name = re.search(r"\bversionName\s+'([^']+)'", text)
          code = re.search(r"\bversionCode\s+(\d+)", text)
          if not name or not code:
              raise SystemExit("Android sürüm alanları bulunamadı.")
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", name.group(1))
          if not match:
              raise SystemExit("Android versionName X.Y.Z biçiminde değil.")
          expected = int(match.group(1))*10000 + int(match.group(2))*100 + int(match.group(3))
          if int(code.group(1)) != expected:
              raise SystemExit(f"versionCode uyuşmuyor: {code.group(1)} / beklenen {expected}")
          print(name.group(1))
          print(code.group(1))
          PY
          )"
          VERSION="$(printf '%s\n' "$VERSION_DATA" | sed -n '1p')"
          VERSION_CODE="$(printf '%s\n' "$VERSION_DATA" | sed -n '2p')"
          LAST_SHA=""
          mkdir -p "$RUNNER_TEMP/last-android-build"
          if gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "Stagepulse-Ses-Merkezi-Android-TEST-build.json" --dir "$RUNNER_TEMP/last-android-build" >/dev/null 2>&1; then
            LAST_SHA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("source_sha", ""))' "$RUNNER_TEMP/last-android-build/Stagepulse-Ses-Merkezi-Android-TEST-build.json")"
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            CHANGED=true
          elif [ "$SOURCE_SHA" = "$LAST_SHA" ]; then
            CHANGED=false
          else
            CHANGED=true
          fi
          {
            echo "source_sha=$SOURCE_SHA"
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "changed=$CHANGED"
          } >> "$GITHUB_OUTPUT"
          echo "Android source: $SOURCE_SHA / $VERSION ($VERSION_CODE), changed=$CHANGED"

  build-test-apk:
    name: Android kaynak, test, imza ve test APK doğrulaması
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RELEASE_VERSION: ${{ needs.detect.outputs.version }}
      RELEASE_VERSION_CODE: ${{ needs.detect.outputs.version_code }}
      SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Özel Ses Merkezi kaynak kodunu al
        uses: actions/checkout@v4
        with:
          repository: ibrahimFOH/Stagepulse-Ses-Merkezi
          ref: main
          token: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Kaynak commit eşleşmesini doğrula
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:android)" = "$SOURCE_SHA"

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: APK varlıklarını ve eğitim dosyalarını doğrula
        run: python android/scripts/verify_assets.py

      - name: Node.js 22 kur ve tüm Android JavaScript dosyalarını denetle
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript sözdizimini doğrula
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d "" file; do
            test -s "$file"
            node --check "$file"
          done < <(find android/app/src/main/assets/ui -type f -name "*.js" -print0)

      - name: Android güncelleme köprüsü ve kurulum güvenliğini denetle
        shell: bash
        run: |
          set -euo pipefail
          JS="android/app/src/main/assets/ui/app.js"
          KT="android/app/src/main/java/com/stagepulse/sesmerkezi/MainActivity.kt"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PATHS="android/app/src/main/res/xml/file_paths.xml"
          grep -Fq "check_updates: () => call('check_updates')" "$JS"
          grep -Fq "install_update: manifest => call('install_update'" "$JS"
          grep -Fq '"check_updates" -> return checkMobileAppUpdates()' "$KT"
          grep -Fq '"install_update" -> return queueMobileAppUpdate' "$KT"
          grep -Fq 'private fun parseMobileUpdateManifest' "$KT"
          grep -Fq 'MessageDigest.getInstance("SHA-256")' "$KT"
          grep -Fq 'REQUEST_INSTALL_PACKAGES' "$MANIFEST"
          grep -Fq 'name="update_cache" path="updates/"' "$PATHS"
          grep -Fq '3.7.4: touch-first phone and tablet layout' android/app/src/main/assets/ui/style.css
          grep -Fq 'new ResizeObserver' "$JS"
          grep -Fq 'visualViewport' "$JS"
          if grep -Fq "Android otomatik güncelleme kanalı henüz imzalı dağıtım deposuna bağlanmadı" "$JS"; then
            echo "Android güncelleme düğmeleri hâlâ devre dışı açıklamasında." >&2
            exit 1
          fi
          echo "ANDROID_UPDATE_BRIDGE_OK"

      - name: Kalıcı Android imza sırlarını doğrula
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Eksik Actions secret: $name"
              exit 1
            fi
          done

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Kalıcı imza anahtarını hazırla
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/stagepulse-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_SIGNING_STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_SIGNING_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: CodeQL başlat
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended
          build-mode: manual

      - name: Android birim testlerini ve imzalı APK derlemesini çalıştır
        run: gradle -p android --no-daemon clean testDebugUnitTest assembleRelease --stacktrace

      - name: CodeQL analizini tamamla
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
          output: codeql-results
          upload: never

      - name: APK sürümünü, paket adını, imzasını ve hizalamasını doğrula
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -q "package: name='com.stagepulse.sesmerkezi' versionCode='$RELEASE_VERSION_CODE' versionName='$RELEASE_VERSION'" <<< "$BADGING"
          mkdir -p release-assets
          APK_NAME="Stagepulse-Ses-Merkezi-Android-$RELEASE_VERSION-TEST.apk"
          STABLE_APK_NAME="Stagepulse-Ses-Merkezi-Android-$RELEASE_VERSION.apk"
          cp "$APK" "release-assets/$APK_NAME"
          cp "$APK" "release-assets/$STABLE_APK_NAME"
          (cd release-assets && sha256sum "$APK_NAME" > "$APK_NAME.sha256" && sha256sum -c "$APK_NAME.sha256")
          (cd release-assets && sha256sum "$STABLE_APK_NAME" > "$STABLE_APK_NAME.sha256" && sha256sum -c "$STABLE_APK_NAME.sha256")
          python3 - "$SOURCE_SHA" "$RELEASE_VERSION" "$RELEASE_VERSION_CODE" <<'PY'
          import json, sys
          from pathlib import Path
          data = {"source_sha": sys.argv[1], "version": sys.argv[2], "version_code": int(sys.argv[3])}
          Path("release-assets/Stagepulse-Ses-Merkezi-Android-TEST-build.json").write_text(
              json.dumps(data, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: APK test artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: Stagepulse-Ses-Merkezi-Android-${{ needs.detect.outputs.version }}-TEST-SIGNED
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Doğrulanmış Android APK dosyalarını kararlı sürüme yayımla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect.outputs.version }}
          prerelease: false
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Stagepulse-Ses-Merkezi-Android-${{ needs.detect.outputs.version }}-TEST.apk
            release-assets/Stagepulse-Ses-Merkezi-Android-${{ needs.detect.outputs.version }}-TEST.apk.sha256
            release-assets/Stagepulse-Ses-Merkezi-Android-${{ needs.detect.outputs.version }}.apk
            release-assets/Stagepulse-Ses-Merkezi-Android-${{ needs.detect.outputs.version }}.apk.sha256
            release-assets/Stagepulse-Ses-Merkezi-Android-TEST-build.json

