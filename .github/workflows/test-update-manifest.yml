name: Güncelleme servisi canlı testi
# v4: canonical stable/test manifest source with explicit no-store HTTP caching

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-manifest:
    name: Herkese açık manifest ve HTTP davranışı
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depo kaynak kodunu al
        uses: actions/checkout@v4

      - name: Yayın iş akışlarının YAML sözdizimini doğrula
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          paths = sorted(Path(".github/workflows").glob("*.yml"))
          if not paths:
              raise SystemExit("İş akışı dosyası bulunamadı.")
          for path in paths:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print("YAML_OK", path)
          PY

      - name: Güncelleme manifestini kimlik doğrulama olmadan çağır
        shell: bash
        run: |
          set -euo pipefail
          URL="https://itasctyjzyewcykozuex.supabase.co/functions/v1/ses-merkezi-updates"
          curl --retry 3 --retry-all-errors --retry-delay 2 --fail --silent --show-error \
            --dump-header manifest-headers.txt --header "Accept: application/json" "$URL" -o manifest.json
          grep -qi '^content-type: application/json' manifest-headers.txt
          grep -qi '^cache-control:.*no-store' manifest-headers.txt
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          data = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          assert data.get("ok") is True, data
          assert isinstance(data.get("published"), bool), data
          if data["published"]:
              version = data.get("version", "")
              assert re.fullmatch(r"\d+\.\d+\.\d+", version), data
              assert data.get("versionName") == version, data
              assert isinstance(data.get("versionCode"), int) and data["versionCode"] > 0, data
              assert data.get("channel") == "stable", data
              assert data.get("url", "").startswith("https://github.com/ibrahimFOH/Stagepulse-Releases/releases/download/"), data
              assert data.get("filename", "").endswith(".exe"), data
              assert re.fullmatch(r"[a-f0-9]{64}", data.get("sha256", "")), data
          else:
              assert isinstance(data.get("message"), str) and data["message"], data
          print("MANIFEST_OK", data.get("version", "henüz yayın yok"))
          PY

      - name: Android kararlı yayın kanalını doğrula
        shell: bash
        run: |
          set -euo pipefail
          URL="https://itasctyjzyewcykozuex.supabase.co/functions/v1/ses-merkezi-updates?platform=android"
          curl --retry 3 --retry-all-errors --retry-delay 2 --fail --silent --show-error \
            --dump-header android-headers.txt --header "Accept: application/json" "$URL" -o android-manifest.json
          grep -qi '^content-type: application/json' android-headers.txt
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          data = json.loads(Path("android-manifest.json").read_text(encoding="utf-8"))
          assert data.get("ok") is True, data
          assert isinstance(data.get("published"), bool), data
          assert data.get("published") is True, data
          version = data.get("version", "")
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), data
          assert data.get("versionName") == version, data
          assert data.get("versionCode") == int(version.split(".")[0])*10000 + int(version.split(".")[1])*100 + int(version.split(".")[2]), data
          assert data.get("apkUrl", "").startswith("https://github.com/ibrahimFOH/Stagepulse-Releases/releases/download/v" + version + "/Stagepulse-Ses-Merkezi-Android-" + version + ".apk"), data
          assert re.fullmatch(r"[a-f0-9]{64}", data.get("apkSha256", "")), data
          assert data.get("release_url", "").endswith("/releases/tag/v" + version), data
          print("ANDROID_STABLE_MANIFEST_OK", version)
          PY

      - name: Test ve kararlı kanalların Windows ve Android yanıtlarını doğrula
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://itasctyjzyewcykozuex.supabase.co/functions/v1/ses-merkezi-updates"
          for platform in windows android; do
            curl --retry 3 --retry-all-errors --retry-delay 2 --fail --silent --show-error \
              "$BASE?platform=$platform&channel=test" -o "${platform}-test.json"
          done
          curl --retry 3 --retry-all-errors --retry-delay 2 --fail --silent --show-error \
            "$BASE?platform=windows&channel=stable" -o windows-stable.json
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          for platform in ("windows", "android"):
              data = json.loads(Path(f"{platform}-test.json").read_text(encoding="utf-8"))
              assert data.get("ok") is True and data.get("published") is True, data
              assert data.get("channel") == "test" and data.get("prerelease") is True, data
              version = data.get("version", "")
              assert re.fullmatch(r"\d+\.\d+\.\d+", version), data
              assert data.get("versionCode") == int(version.split(".")[0])*10000 + int(version.split(".")[1])*100 + int(version.split(".")[2]), data
              url_key, hash_key = (("url", "sha256") if platform == "windows" else ("apkUrl", "apkSha256"))
              ext = "exe" if platform == "windows" else "apk"
              expected = f"https://github.com/ibrahimFOH/Stagepulse-Releases/releases/download/v{version}/Stagepulse-Ses-Merkezi-{platform.title()}-{version}.{ext}"
              assert data.get(url_key) == expected, data
              assert re.fullmatch(r"[a-f0-9]{64}", data.get(hash_key, "")), data
              print("TEST_CHANNEL_OK", platform, version)
          stable = json.loads(Path("windows-stable.json").read_text(encoding="utf-8"))
          assert stable.get("ok") is True and stable.get("channel") == "stable", stable
          assert stable.get("prerelease") is not True, stable
          if stable.get("published"):
              assert stable.get("url", "").startswith("https://github.com/ibrahimFOH/Stagepulse-Releases/releases/download/"), stable
              assert re.fullmatch(r"[a-f0-9]{64}", stable.get("sha256", "")), stable
          print("STABLE_CHANNEL_OK", stable.get("version", "no-windows-release-yet"))
          PY

      - name: CORS ve HTTP yöntem sınırlarını denetle
        shell: bash
        run: |
          set -euo pipefail
          URL="https://itasctyjzyewcykozuex.supabase.co/functions/v1/ses-merkezi-updates"
          OPTIONS_HEADERS="$(mktemp)"
          OPTIONS_STATUS="$(curl --silent --show-error --dump-header "$OPTIONS_HEADERS" --output /dev/null --write-out "%{http_code}" \
            --request OPTIONS "$URL")"
          test "$OPTIONS_STATUS" = "200"
          grep -qi '^access-control-allow-origin: \*' "$OPTIONS_HEADERS"
          grep -qi '^access-control-allow-methods: GET, OPTIONS' "$OPTIONS_HEADERS"
          STATUS="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --request POST "$URL")"
          test "$STATUS" = "405"
          rm -f "$OPTIONS_HEADERS"

  release-preflight:
    name: Yayın deposu secret ve erişim ön kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Kaynak depo erişimi ve kalıcı Android imzasını kontrol et
        shell: bash
        env:
          SOURCE_REPO_READ_TOKEN: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in SOURCE_REPO_READ_TOKEN ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "### Yayın ön kontrolü: eksik secret"
              for name in "${missing[@]}"; do printf -- "- %s\n" "$name"; echo "::warning::Missing required release secret: $name"; done
              echo "Bu eksikler kararlı sürüm yayınını engeller. Değerler yalnızca Stagepulse-Releases deposuna eklenmelidir."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          STORE="$RUNNER_TEMP/stagepulse-preflight.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          if ! keytool -list -keystore "$STORE" -storepass "$ANDROID_SIGNING_STORE_PASSWORD" -alias "$ANDROID_SIGNING_KEY_ALIAS" >/dev/null; then
            echo "::error::JKS dosyası, keystore parolası veya alias doğrulanamadı."
            exit 1
          fi
          PROBE_DIR="$(mktemp -d)"
          printf 'Stagepulse imza kontrolü\n' > "$PROBE_DIR/probe.txt"
          jar --create --file "$PROBE_DIR/probe.jar" -C "$PROBE_DIR" probe.txt
          if ! jarsigner -keystore "$STORE" -storepass "$ANDROID_SIGNING_STORE_PASSWORD" -keypass "$ANDROID_SIGNING_KEY_PASSWORD" -signedjar "$PROBE_DIR/probe-signed.jar" "$PROBE_DIR/probe.jar" "$ANDROID_SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Android özel anahtar parolası veya alias doğrulanamadı."
            rm -rf "$PROBE_DIR" "$STORE"
            exit 1
          fi
          jarsigner -verify "$PROBE_DIR/probe-signed.jar" >/dev/null
          rm -rf "$PROBE_DIR" "$STORE"
          AUTH="$(printf 'x-access-token:%s' "$SOURCE_REPO_READ_TOKEN" | base64 -w0)"
          if ! GIT_TERMINAL_PROMPT=0 git -c "http.extraheader=AUTHORIZATION: basic $AUTH" ls-remote \
            https://github.com/ibrahimFOH/Stagepulse-Ses-Merkezi.git \
            refs/heads/integration/3.7.0-shared-core-demo >/dev/null; then
            echo "::error::SOURCE_REPO_READ_TOKEN özel Stagepulse-Ses-Merkezi deposunu okuyamıyor. Fine-grained token için doğru depo ve Contents: Read-only iznini kontrol edin."
            exit 1
          fi
          echo "### Yayın ön kontrolü: başarılı" >> "$GITHUB_STEP_SUMMARY"
          echo "- Özel kaynak depoya salt-okunur erişim doğrulandı."
          echo "- Kalıcı Android imza deposu ve alias doğrulandı."

  runner-smoke-windows:
    name: Herkese açık Windows runner erişimi
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: Windows runner ve PowerShell doğrulaması
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne "Windows") { throw "Beklenen Windows runner bulunamadı." }
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) { throw "Python bulunamadı." }
          Write-Host "PUBLIC_WINDOWS_RUNNER_OK"
          Write-Host "Python: $(python --version)"
